kind = "web"
previewPath = "/"
title = "CosmoVeda Skin and Hair Clinic"
version = "1.0.0"
id = "artifacts/cosmoveda"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20570

[services.development]
run = "pnpm --filter @workspace/cosmoveda run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cosmoveda", "run", "build" ]
publicDir = "artifacts/cosmoveda/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20570"
BASE_PATH = "/"
